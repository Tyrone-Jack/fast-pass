services:
  db:
    image: postgres:16-alpine
    container_name: fastpass-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastpass
      POSTGRES_PASSWORD: fastpass
      POSTGRES_DB: fastpass
    volumes:
      - fastpass_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpass -d fastpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: fastpass-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://fastpass:fastpass@db:5432/fastpass
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: fastpass-web-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  fastpass_pgdata_prod:
